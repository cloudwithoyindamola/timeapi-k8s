name: CI/CD (build -> scan -> helm deploy)

on:
  push:
    branches: [ "dev", "staging", "main" ]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  actions: read
  security-events: write

env:
  # Pull sensitive info from GitHub Secrets
  ACR_NAME: ${{ secrets.ACR_NAME }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set IMAGE_TAG
        id: set-tag
        run: echo "IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build Docker image
        run: docker build -t ${{ env.ACR_NAME }}.azurecr.io/timeapi-devops:${{ steps.set-tag.outputs.IMAGE_TAG }} ./app

      - name: Push Docker image
        run: docker push ${{ env.ACR_NAME }}.azurecr.io/timeapi-devops:${{ steps.set-tag.outputs.IMAGE_TAG }}

      - name: Trivy scan (LOW+UNKNOWN)
        uses: aquasecurity/trivy-action@v0.25.0
        with:
          image-ref: ${{ env.ACR_NAME }}.azurecr.io/timeapi-devops:${{ steps.set-tag.outputs.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: LOW,UNKNOWN
          ignore-unfixed: true
          exit-code: 0  # ensures workflow does not fail if vulnerabilities exist

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-scan
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set environment from branch
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
            echo "NAMESPACE=prod" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
            echo "NAMESPACE=staging" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "NAMESPACE=dev" >> $GITHUB_ENV
          fi
          echo "IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-8)" >> $GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group ${{ secrets.RESOURCE_GROUP }} \
          --name ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Helm upgrade/install
        run: |
          helm upgrade --install timeapi-devops ./timeapi-devops \
            --namespace "${{ env.NAMESPACE }}" --create-namespace \
            --set image.repository=${{ env.ACR_NAME }}.azurecr.io/timeapi-devops \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --set environment=${{ env.ENVIRONMENT }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/timeapi-devops -n "${{ env.NAMESPACE }}" --timeout=3m || true
          kubectl get pods -n "${{ env.NAMESPACE }}"
          kubectl get svc -n "${{ env.NAMESPACE }}"
          kubectl get ingress -n "${{ env.NAMESPACE }}" || true
